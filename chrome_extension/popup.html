<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IPL Live Predictor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      width: 360px;
      min-height: 480px;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(90deg, #f7971e, #ffd200);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header .logo { font-size: 28px; }
    .header h1 { font-size: 16px; font-weight: 700; color: #0f0c29; line-height: 1.2; }
    .header small { font-size: 11px; color: #302b63; }

    /* ── Live Badge ── */
    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .pulse-dot {
      width: 8px; height: 8px;
      background: #ff4136;
      border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.6); }
    }
    .live-label { font-size: 11px; font-weight: 600; color: #ff4136; letter-spacing: 1px; }

    /* ── Match Card ── */
    .match-card {
      margin: 14px 14px 0;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,215,0,0.2);
      border-radius: 12px;
      padding: 14px;
      backdrop-filter: blur(8px);
    }
    .match-title {
      font-size: 13px;
      font-weight: 600;
      color: #ffd200;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .match-score {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .match-status {
      font-size: 11px;
      color: #aaa;
    }

    /* ── Stats Grid ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 14px;
    }
    .stat-box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      transition: transform 0.2s, background 0.2s;
      cursor: pointer;
    }
    .stat-box:hover {
      transform: translateY(-2px);
      background: rgba(255,215,0,0.1);
    }
    .stat-box .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #ffd200;
    }
    .stat-box .stat-label {
      font-size: 10px;
      color: #aaa;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Prediction Bar ── */
    .prediction-section {
      padding: 0 14px 14px;
    }
    .prediction-title {
      font-size: 12px;
      font-weight: 600;
      color: #ffd200;
      margin-bottom: 8px;
    }
    .pred-bar-container {
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      overflow: hidden;
      height: 22px;
      position: relative;
    }
    .pred-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f7971e, #ffd200);
      border-radius: 20px;
      transition: width 1s ease;
      display: flex;
      align-items: center;
      padding-left: 10px;
    }
    .pred-bar-label {
      font-size: 11px;
      font-weight: 600;
      color: #0f0c29;
    }
    .pred-team-label {
      font-size: 10px;
      color: #aaa;
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
    }

    /* ── Actions ── */
    .actions {
      padding: 0 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: linear-gradient(90deg, #f7971e, #ffd200);
      color: #0f0c29;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      padding-bottom: 12px;
    }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #aaa;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #ffd200;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    .error-box {
      margin: 14px;
      background: rgba(255,65,54,0.15);
      border: 1px solid rgba(255,65,54,0.3);
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      color: #ff8080;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">🏏</div>
    <div>
      <h1>IPL Live Predictor</h1>
      <small>Real-time Analytics & Prediction</small>
    </div>
  </div>

  <!-- Live Badge -->
  <div class="live-badge">
    <div class="pulse-dot"></div>
    <span class="live-label">LIVE</span>
    <span id="last-updated" style="font-size:10px;color:#888;margin-left:auto;"></span>
  </div>

  <!-- Match Card -->
  <div class="match-card" id="match-card">
    <div class="loading">
      <div class="spinner"></div>
      Fetching live data…
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid" id="stats-grid" style="display:none;">
    <div class="stat-box">
      <div class="stat-value" id="stat-total-matches">—</div>
      <div class="stat-label">Total Matches</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="stat-top-team">—</div>
      <div class="stat-label">Top Team</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="stat-avg-score">—</div>
      <div class="stat-label">Avg Score</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="stat-season">2025</div>
      <div class="stat-label">IPL Season</div>
    </div>
  </div>

  <!-- Win Prediction Bar -->
  <div class="prediction-section" id="prediction-section" style="display:none;">
    <div class="prediction-title">🎯 Win Probability</div>
    <div class="pred-bar-container">
      <div class="pred-bar-fill" id="pred-bar" style="width:50%;">
        <span class="pred-bar-label" id="pred-team1-pct">50%</span>
      </div>
    </div>
    <div class="pred-team-label">
      <span id="pred-team1-name">Team A</span>
      <span id="pred-team2-name">Team B</span>
    </div>
  </div>

  <!-- Error Box -->
  <div id="error-box" class="error-box" style="display:none;"></div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-primary" id="btn-dashboard" onclick="openDashboard()">
      📊 Open Full Dashboard
    </button>
    <button class="btn btn-secondary" id="btn-refresh" onclick="refreshData()">
      🔄 Refresh Data
    </button>
  </div>

  <!-- Footer -->
  <div class="footer">IPL Prediction System • Powered by CricAPI + Scraper</div>

  <script src="popup.js"></script>
</body>
</html>
